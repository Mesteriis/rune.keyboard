name: build-rune-text-0.1

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/rune-model-delivery'
    name: clean-linux-build-${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable Qwen source
        run: |
          python -m pip install --disable-pip-version-check huggingface-hub==0.36.2 hf-xet==1.6.0
          hf download Qwen/Qwen3-0.6B-Base \
            --revision da87bfb608c14b7cf20ba1ce41287e8de496c0cd \
            --local-dir "$RUNNER_TEMP/rune-source" \
            --quiet
          cd "$RUNNER_TEMP/rune-source"
          sha256sum model.safetensors
          sha256sum --check "$GITHUB_WORKSPACE/tools/model/rune-text-0.1/source.sha256"
      - name: Build in a clean pinned container
        run: |
          mkdir -p "$RUNNER_TEMP/rune-output"
          docker build --pull=false \
            --tag rune-text-builder:0.1 \
            tools/model/rune-text-0.1
          docker run --rm \
            --mount "type=bind,src=$RUNNER_TEMP/rune-source,dst=/source,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tools/model/rune-text-0.1,dst=/recipe,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/rune-output,dst=/output" \
            rune-text-builder:0.1
      - uses: actions/upload-artifact@v4
        with:
          name: rune-text-linux-${{ matrix.run }}
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/rune-output/**

  compare:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/rune-model-delivery'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rune-text-linux-*
          path: outputs
      - name: Require byte-identical artifacts
        run: |
          asset=rune-text-v1-0.1.0-q4_k_m.gguf
          cmp "outputs/rune-text-linux-1/$asset" "outputs/rune-text-linux-2/$asset"
          first=$(awk '{print $1}' "outputs/rune-text-linux-1/$asset.sha256")
          second=$(awk '{print $1}' "outputs/rune-text-linux-2/$asset.sha256")
          test "$first" = "$second"
          printf 'reproducible_sha256=%s\n' "$first"
      - uses: actions/upload-artifact@v4
        with:
          name: rune-text-0.1-reproducible-candidate
          if-no-files-found: error
          compression-level: 0
          path: outputs/rune-text-linux-1/**
