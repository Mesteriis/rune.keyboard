name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [stdlib, scientific]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exhaustive tracked test inventory and runner
        run: |
          python tools/ci/python_tools_tests.py --check
          python -m unittest discover -s tools/ci -p test_python_tools_tests.py -v
      - name: Install pinned scientific dependencies
        if: matrix.profile == 'scientific'
        run: python -m pip install -r tools/typing_experiments/requirements.txt
      - name: Run isolated Python tool modules
        run: python tools/ci/python_tools_tests.py --profile "${{ matrix.profile }}" --output "build/python-tools-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-tools-${{ matrix.profile }}
          path: build/python-tools-${{ matrix.profile }}/
          if-no-files-found: error
      # Six historical-artifact modules remain inventoried but cannot run in a
      # fresh checkout until their original datasets/models are restored. Q7
      # remains incomplete; see docs/python-tools-tests.md.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify exact F-Droid review data exceptions
        run: |
          python3 tools/fdroid_data_policy.py
          python3 -m unittest discover -s tools -p test_fdroid_data_policy.py
      - name: Verify durable public corpus exclusions
        run: |
          python3 tools/typing_experiments/holdout_ledger.py --validate-only
          python3 -m unittest discover -s tools/typing_experiments -p 'test_*holdout_ledger.py'
          python3 -m unittest discover -s tools/typing_experiments -p test_conversation_split_checks.py
          python3 -m unittest discover -s tools/typing_experiments -p 'test_legacy_holdout_*.py'
          python3 -m unittest discover -s tools/typing_experiments -p test_legacy_family_recovery.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_ranker_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_joint_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_restore_frozen_followup.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_family_coverage.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_spelling_v6.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_early_ru_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_recover_early_ru_sources.py
          python3 -m unittest discover -s tools/typing_experiments -p test_merge_early_ru_sources.py
          python3 tools/typing_experiments/control_ledger.py --validate-only
          python3 -m unittest discover -s tools/typing_experiments -p test_control_ledger.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_control_components.py
          python3 -m unittest discover -s tools/typing_experiments -p test_public_control_ledger.py
          python3 -m unittest discover -s tools/typing_experiments -p test_recover_punctuation_articles.py
          python3 -m unittest discover -s tools/typing_experiments -p test_public_corpus_preparation_v1.py
          python3 -m unittest discover -s tools/typing_experiments -p test_prepare_public_spelling_v1.py
          python3 -m unittest discover -s tools/typing_experiments -p test_prepare_public_controls_v1.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_natural_context_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_source_identities.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_tatoeba_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_quarantine_unknown_families.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_legacy_context_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_unmanifested_conversation.py
          python3 -m unittest discover -s tools/typing_experiments -p test_recover_ranker_sources.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_authored_training_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_late_authored_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_applied_authored_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_auxiliary_authored_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_frozen_context_descendants.py
          python3 tools/typing_experiments/audit_late_source_closure.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_late_source_closure.py
          python3 -m unittest discover -s tools/typing_experiments -p test_right_context_training_exclusion.py
          python3 -m unittest discover -s tools/typing_experiments -p test_right_context_sentence_audit.py
          python3 tools/ci/generate_product_replay_v1.py --check
          python3 tools/ci/register_product_replay_v1.py --check
          python3 tools/ci/register_historical_replay.py --check
          python3 -m unittest discover -s tools/ci -p 'test_product_replay*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Run fresh JVM tests
        run: ./gradlew testDebugUnitTest --rerun-tasks
      - name: Verify current-product replay against the frozen multilingual baseline
        run: python3 tools/ci/product_replay_ci.py --java "$JAVA_HOME/bin/java" --output build/product-replay-ci
      - name: Synthetic CPU duty trace contracts and report
        run: |
          python3 -m unittest discover -s tools/qa/smart-typing-0.3/duty-traces -p test_report.py
          python3 tools/qa/smart-typing-0.3/duty-traces/report.py --xml app/build/test-results/testDebugUnitTest/TEST-io.github.mesteriis.rune.keyboard.intelligence.inference.ModelDutyTraceTest.xml --output-dir build/model-duty-trace-ci
      - name: Verify offline lexicon source and benchmark contracts
        run: |
          python3 tools/lexicon/smart-typing-0.3/pipeline.py --build-dir build/lexicon-regression test
          python3 -m unittest discover -s tools/lexicon/smart-typing-0.3 -p test_build_packed_assets.py
          python3 -m unittest discover -s tools/lexicon/smart-typing-0.3 -p test_stage_packed_assets.py
          # Historical benchmark and weighted-qualification evidence lives in the
          # evidence backup branch. Ordinary CI verifies source-backed lexicon contracts
          # and must not require runtime or historical-result artifacts from main.
      - name: Verify offline scoring harness without a model
        run: |
          python3 tools/eval/smart-typing-0.3/evaluate.py validate
          python3 -m unittest discover -s tools/eval/smart-typing-0.3 -p 'test_*.py' -v
          python3 -m unittest discover -s tools/eval/smart-typing-0.3/pipeline -p 'test_*.py' -v
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/eval/smart-typing-0.3 -B build/scoring-eval-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja"
          "$cmake_bin" --build build/scoring-eval-ci --target rune-score scoring-math-test -j 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/scoring-eval-ci --output-on-failure
      - name: Verify native scoring and in-tokenizer cancellation without a model
        run: |
          python3 -m unittest discover -s tools/test-native-scoring -p 'test_*.py' -v
          python3 -m unittest discover -s tools/test-native-scoring/runtime-benchmark -p test_protocol.py -v
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/test-native-scoring -B build/native-scoring-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja"
          "$cmake_bin" --build build/native-scoring-ci --parallel 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/native-scoring-ci --output-on-failure -V
      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            build/model-duty-trace-ci/**
            build/product-replay-ci/**
            build/product-replay-ci-historical/**
            tools/ci/product-replay-v1/NOTICE.md
            tools/ci/product-replay-v1/source-lock.json
            tools/ci/product-replay-history-v1/NOTICE.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Build, lint, and verify privacy
        run: ./gradlew lint assembleDebug assembleRelease assembleProfile privacyGateRelease privacyGateProfile imeIntelligenceBoundary forbiddenRuntimeDependencies :runtime-llama:nativeSymbolGate :app:apkFootprint
      - name: Verify packaged native ABI boundary
        run: |
          python3 -m unittest discover -s tools -p test_verify_packaged_native.py -v
          tools/verify-native-runtime.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stage installable artifacts
        run: |
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-artifacts/rune-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload APK footprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-footprint
          if-no-files-found: warn
          path: |
            app/build/reports/apk-footprint/release.json
            tools/apk-footprint-budgets.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-debug.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-release-unsigned.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          if-no-files-found: error
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.sarif

  emulator-smoke:
    name: emulator-smoke-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    # Full real-Binder suites now take about 22 minutes after an emulator is ready;
    # allow provisioning, APK installation and artifact collection to complete.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '26'
            target: google_apis
            ram-size: 2048M
            disk-size: 6G
            gpu-mode: swiftshader_indirect
            emulator-features: ''
          - api-level: '37.0'
            target: google_apis_ps16k
            ram-size: 4096M
            disk-size: 6G
            gpu-mode: swiftshader_indirect
            emulator-features: -feature GLDirectMem -feature HasSharedSlotsHostMemoryAllocator -feature -Vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android boundary suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          disable-animations: true
          # The inset regression requires an actual software navigation bar. AVD
          # hardware-key defaults otherwise remove it entirely on both API levels.
          emulator-options: -no-window -prop qemu.hw.mainkeys=0 -gpu ${{ matrix.gpu-mode }} ${{ matrix.emulator-features }} -noaudio -no-boot-anim -no-snapshot-save
          script: |
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest :runtime-llama:assembleDebugAndroidTest
            ./gradlew --no-daemon installDebug
            mkdir -p app/build/ci-device
            while true; do adb logcat -v threadtime; sleep 1; done > app/build/ci-device/logcat.txt 2>&1 &
            adb shell settings put secure show_ime_with_hard_keyboard 1
            for attempt in $(seq 1 15); do if adb shell ime enable io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService; then break; fi; if [ "$attempt" -eq 15 ]; then exit 1; fi; sleep 2; done
            adb shell ime set io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService
            adb shell am start -W -n io.github.mesteriis.rune.keyboard/.qa.ImeQaActivity
            # This runner owns a disposable AVD; numeric/reset fixtures reject missing ownership.
            if ! ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.runeOwnedEmulator=q4-counters; then python3 tools/ci/report-instrumentation-failures.py || true; exit 1; fi
            ./gradlew --no-daemon :runtime-llama:connectedDebugAndroidTest
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/ci-device/**
