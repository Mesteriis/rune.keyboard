          python3 tools/typing_experiments/ewt_frequency_lemma_exclusions.py --check
          python3 -m unittest discover -s tools/typing_experiments -p test_ewt_surface_exclusions_v1.py
          python3 tools/typing_experiments/ewt_surface_exclusions_v1.py --check
          python3 -m unittest discover -s tools/typing_experiments -p test_english_ewt_error_model.py
