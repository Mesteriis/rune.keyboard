name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Run fresh JVM tests
        run: ./gradlew testDebugUnitTest --rerun-tasks
      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Build, lint, and verify privacy
        run: ./gradlew lint assembleDebug assembleRelease assembleProfile privacyGateRelease privacyGateProfile imeIntelligenceBoundary forbiddenRuntimeDependencies :runtime-llama:nativeSymbolGate
      - name: Verify packaged native ABI boundary
        run: tools/verify-native-runtime.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stage installable artifacts
        run: |
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-artifacts/rune-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-debug.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-release-unsigned.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          if-no-files-found: error
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.sarif

  emulator-smoke:
    name: emulator-smoke-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '26'
            ram-size: 2048M
            disk-size: 6G
          - api-level: '37.0'
            ram-size: 4096M
            disk-size: 6G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android boundary suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot-save
          pre-emulator-launch-script: |
            tools/ci/install-adb-wrapper
            ./gradlew assembleDebug assembleDebugAndroidTest :runtime-llama:assembleDebugAndroidTest
            ./gradlew --stop
          script: |
            ./gradlew --no-daemon installDebug
            mkdir -p app/build/ci-device
            adb logcat -v threadtime > app/build/ci-device/logcat.txt 2>&1 &
            adb shell settings put secure show_ime_with_hard_keyboard 1
            for attempt in $(seq 1 15); do if adb shell ime enable io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService; then break; fi; if [ "$attempt" -eq 15 ]; then exit 1; fi; sleep 2; done
            adb shell ime set io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService
            adb shell am start -W -n io.github.mesteriis.rune.keyboard/.qa.ImeQaActivity
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            ./gradlew --no-daemon :runtime-llama:connectedDebugAndroidTest
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/reports/androidTests/connected/debug/**
            app/build/ci-device/**
