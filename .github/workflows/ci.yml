          python3 tools/ci/register_wordrank_boundaries.py --check
          python3 -m unittest discover -s tools/ci -p 'test_register_ewt_control_source.py' -v
          python3 tools/ci/register_ewt_control_source.py --check
          python3 -m unittest discover -s tools/ci -p 'test_ewt_product_replay.py' -v
          python3 -m unittest discover -s tools/ci -p 'test_ewt_product_report.py' -v
