          python3 -m unittest discover -s tools/ci -p 'test_authored_typo_diagnostics.py' -v
          python3 tools/ci/authored_typo_diagnostics.py --java "$JAVA_HOME/bin/java" --output build/authored-typo-replay-ci
          python3 -m unittest discover -s tools/ci -p 'test_authored_phrase_replay.py' -v
          python3 tools/ci/authored_phrase_replay.py --java "$JAVA_HOME/bin/java" --output build/authored-phrase-replay-ci
          python3 tools/ci/phrase_replay_smoke.py --java "$JAVA_HOME/bin/java" --output build/phrase-replay-ci
          python3 tools/ci/phrase_boundary_sources.py --java "$JAVA_HOME/bin/java" --output build/phrase-review-ci
      - name: Compile and export production morphology candidates
        run: python3 tools/morphology/evaluate.py export --java "$JAVA_HOME/bin/java" --output build/morphology-export-ci
      - name: Compile and export manual retrieval proposals
        run: python3 tools/ci/retrieval_export_smoke.py --java "$JAVA_HOME/bin/java" --output build/retrieval-export-ci
      - name: Compile bound joint controller replay and disclosed evaluation
        run: python3 tools/ci/joint_evaluation_smoke.py --java "$JAVA_HOME/bin/java" --output build/joint-evaluation-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce historical v5/v6 role training candidate groups
        run: |
          git fetch --no-tags --depth=1 origin 3bd893ca175bf7c62760611d09c0dab7e5d1fe68
          python3 -m venv "$RUNNER_TEMP/rune-role-training"
          role_python="$RUNNER_TEMP/rune-role-training/bin/python"
          "$role_python" -m pip install --require-hashes --only-binary=:all: -r tools/morphology/requirements.lock
          "$role_python" tools/typing_experiments/recover_role_training_groups.py \
            --java "$JAVA_HOME/bin/java" --output build/historical-role-groups-ci
      - name: Prepare pinned joint calibration numerical environment
        run: |
          python3 -m venv build/joint-calibration-ci-venv
          build/joint-calibration-ci-venv/bin/python -m pip install -r tools/typing_experiments/requirements.txt
      - name: Compile and calibrate bound disclosed joint proposals
        run: build/joint-calibration-ci-venv/bin/python tools/ci/joint_calibration_smoke.py --java "$JAVA_HOME/bin/java" --output build/joint-calibration-ci
      - name: Synthetic CPU duty trace contracts and report
        run: |
          python3 -m unittest discover -s tools/qa/smart-typing-0.3/duty-traces -p test_report.py
          python3 tools/qa/smart-typing-0.3/duty-traces/report.py --xml app/build/test-results/testDebugUnitTest/TEST-io.github.mesteriis.rune.keyboard.intelligence.inference.ModelDutyTraceTest.xml --output-dir build/model-duty-trace-ci
      - name: Verify offline lexicon source and benchmark contracts
        run: |
          python3 tools/lexicon/smart-typing-0.3/pipeline.py --build-dir build/lexicon-regression test
          python3 -m unittest discover -s tools/lexicon/smart-typing-0.3 -p test_build_packed_assets.py
          python3 -m unittest discover -s tools/lexicon/smart-typing-0.3 -p test_stage_packed_assets.py
          # Historical benchmark and weighted-qualification evidence lives in the
          # evidence backup branch. Ordinary CI verifies source-backed lexicon contracts
          # and must not require runtime or historical-result artifacts from main.
      - name: Verify offline scoring harness without a model
        run: |
          python3 tools/eval/smart-typing-0.3/evaluate.py validate
          python3 -m unittest discover -s tools/eval/smart-typing-0.3 -p 'test_*.py' -v
          python3 -m unittest discover -s tools/eval/smart-typing-0.3/pipeline -p 'test_*.py' -v
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/eval/smart-typing-0.3 -B build/scoring-eval-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja"
          "$cmake_bin" --build build/scoring-eval-ci --target rune-score scoring-math-test -j 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/scoring-eval-ci --output-on-failure
      - name: Verify native scoring and in-tokenizer cancellation without a model
        run: |
          python3 -m unittest discover -s tools/test-native-scoring -p 'test_*.py' -v
          python3 -m unittest discover -s tools/test-native-scoring/runtime-benchmark -p test_protocol.py -v
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/test-native-scoring -B build/native-scoring-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja"
          "$cmake_bin" --build build/native-scoring-ci --parallel 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/native-scoring-ci --output-on-failure -V
      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            build/model-duty-trace-ci/**
            build/product-replay-ci/**
            build/product-replay-ci-historical/**
            build/phrase-replay-ci/**
            build/phrase-review-ci/**
            build/morphology-export-ci/**
            build/retrieval-export-ci/**
            build/joint-evaluation-ci/**
            build/joint-calibration-ci/**
            build/historical-role-groups-ci/receipt.json
            tools/ci/product-replay-v1/NOTICE.md
            tools/ci/product-replay-v1/source-lock.json
            tools/ci/product-replay-history-v1/NOTICE.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null < <(yes)
      - name: Build, lint, and verify privacy
        run: ./gradlew lint assembleDebug assembleRelease assembleProfile privacyGateRelease privacyGateProfile imeIntelligenceBoundary forbiddenRuntimeDependencies :runtime-llama:nativeSymbolGate :app:apkFootprint
      - name: Verify packaged native ABI boundary
        run: |
          python3 -m unittest discover -s tools -p test_verify_packaged_native.py -v
          tools/verify-native-runtime.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stage installable artifacts
        run: |
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-artifacts/rune-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload APK footprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-footprint
          if-no-files-found: warn
          path: |
            app/build/reports/apk-footprint/release.json
            tools/apk-footprint-budgets.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-debug.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-release-unsigned.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          if-no-files-found: error
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.sarif

  emulator-smoke:
    name: emulator-smoke-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    # A current local general suite alone took about 49 minutes on ARM64;
    # allow provisioning, separately routed suites and artifact collection too.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '26'
            target: google_apis
            ram-size: 2048M
            disk-size: 6G
            gpu-mode: swiftshader_indirect
            emulator-features: ''
          - api-level: '37.0'
            target: google_apis_ps16k
            ram-size: 4096M
            disk-size: 6G
            gpu-mode: swiftshader_indirect
            emulator-features: -feature GLDirectMem -feature HasSharedSlotsHostMemoryAllocator -feature -Vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null < <(yes)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android suite routing
        run: |
          python3 -m unittest discover -s tools/ci -p test_android_boundary_suites.py
          python3 -m unittest discover -s tools/ci -p test_android_synthetic_restart_suites.py
          python3 -m unittest discover -s tools/ci -p test_android_editing_process_death.py
          python3 -m unittest discover -s tools/ci -p test_android_voice_fixture_suites.py
          python3 -m unittest discover -s tools/ci -p test_android_chrome_editor.py
          python3 -m unittest discover -s tools/ci -p test_android_night_learning.py
          python3 -m unittest discover -s tools/ci -p test_collect_android_failure_artifacts.py
          python3 -m unittest discover -s tools/ci -p test_android_ci_shell.py
      - name: Build Android boundary APKs before emulator startup
        id: boundary-apks
        run: |
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest :runtime-llama:assembleDebugAndroidTest
          ./gradlew --no-daemon -p tools/qa/compose-editor assembleDebug
      - name: Select night-learning emulator timezone
        id: night-learning-timezone
        run: |
          timezone="$(PYTHONPATH=tools/ci python3 -c 'from datetime import datetime, timezone; from android_night_learning import night_timezone; print(night_timezone(datetime.now(timezone.utc)))')"
          echo "zone=$timezone" >> "$GITHUB_OUTPUT"
      - name: Run night-learning fixture on a fresh emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          avd-name: rune-ci-night-learning
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          emulator-options: -no-window -wipe-data -no-snapshot -timezone ${{ steps.night-learning-timezone.outputs.zone }} -gpu ${{ matrix.gpu-mode }} ${{ matrix.emulator-features }} -noaudio -no-boot-anim
          script: python3 tools/ci/android_night_learning.py --api '${{ matrix.api-level }}' --output build/ci-night-learning
      - name: Run Android boundary suite
        # Continue after a night-learning failure while retaining that failure in the job.
        if: ${{ !cancelled() && steps.boundary-apks.outcome == 'success' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          avd-name: rune-ci-boundary
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          disable-animations: true
          # The inset regression requires an actual software navigation bar. AVD
          # hardware-key defaults otherwise remove it entirely on both API levels.
          emulator-options: -no-window -prop qemu.hw.mainkeys=0 -gpu ${{ matrix.gpu-mode }} ${{ matrix.emulator-features }} -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -e
            # Refuse before installing or changing IME settings if ADB sees an
            # unexpected device or the emulator identity is not the CI AVD.
            PYTHONPATH=tools/ci python3 -c 'from android_synthetic_restart_suites import owned_emulator; owned_emulator("rune-ci-boundary")'
            capture_ci_failures() {
              suite_exit=$?
              trap - EXIT
              set +e
              python3 tools/ci/collect_android_failure_artifacts.py --avd-name rune-ci-boundary --output app/build/ci-device/failure-artifacts
              capture_exit=$?
              if [ "$capture_exit" -ne 0 ]; then
                echo "Android failure-artifact collection failed: $capture_exit" >&2
                if [ "$suite_exit" -eq 0 ]; then suite_exit=$capture_exit; fi
              fi
              exit "$suite_exit"
            }
            trap capture_ci_failures EXIT
            compose_serial="$(PYTHONPATH=tools/ci python3 -c 'from android_synthetic_restart_suites import owned_emulator; print(owned_emulator("rune-ci-boundary"))')"
            adb -s "$compose_serial" install -r tools/qa/compose-editor/build/outputs/apk/debug/RuneComposeEditorQa-debug.apk
            adb -s "$compose_serial" install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p app/build/ci-device
            while true; do adb -s "$compose_serial" logcat -v threadtime || true; sleep 1; done > app/build/ci-device/logcat.txt 2>&1 &
            adb -s "$compose_serial" shell settings put secure show_ime_with_hard_keyboard 1
            for attempt in $(seq 1 15); do if adb -s "$compose_serial" shell ime enable io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService; then break; fi; if [ "$attempt" -eq 15 ]; then exit 1; fi; sleep 2; done
            adb -s "$compose_serial" shell ime set io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService
            adb -s "$compose_serial" shell am start -W -n io.github.mesteriis.rune.keyboard/.qa.ImeQaActivity
            # The disposable AVD has distinct q3/q4/q8 and separate-package fixtures.
            # Run every scope separately and retain each fresh XML report and log.
            suite_status=0
            python3 tools/ci/android_boundary_suites.py --api '${{ matrix.api-level }}' --output app/build/ci-device/boundary-suites --avd-name rune-ci-boundary || suite_status=$?
            # Qualification suites build a different debug application ID into the
            # same output paths. Restore both ordinary APKs before restart tests.
            restart_build_status=0
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest || restart_build_status=$?
            if [ "$restart_build_status" -ne 0 ]; then
              if [ "$suite_status" -eq 0 ]; then suite_status=$restart_build_status; fi
            else
              python3 tools/ci/android_synthetic_restart_suites.py --avd-name rune-ci-boundary --output build/ci-synthetic-restart || {
              restart_status=$?
              if [ "$suite_status" -eq 0 ]; then suite_status=$restart_status; fi
              }
              python3 tools/ci/android_editing_process_death.py --avd-name rune-ci-boundary --output build/ci-editing-process-death || {
              editing_status=$?
              if [ "$suite_status" -eq 0 ]; then suite_status=$editing_status; fi
              }
              python3 tools/ci/android_voice_fixture_suites.py --avd-name rune-ci-boundary --output build/ci-voice-fixture || {
              voice_status=$?
              if [ "$suite_status" -eq 0 ]; then suite_status=$voice_status; fi
              }
              if [ '${{ matrix.api-level }}' = '37.0' ]; then
                python3 tools/ci/android_chrome_editor.py --avd-name rune-ci-boundary --output build/ci-chrome-editor || {
                  chrome_status=$?
                  if [ "$suite_status" -eq 0 ]; then suite_status=$chrome_status; fi
                }
                python3 tools/ci/android_chrome_editor.py --avd-name rune-ci-boundary --output build/ci-chrome-omnibox --navigation || {
                  chrome_status=$?
                  if [ "$suite_status" -eq 0 ]; then suite_status=$chrome_status; fi
                }
              fi
            fi
            exit "$suite_status"
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/ci-device/**
            build/ci-synthetic-restart/**
            build/ci-editing-process-death/**
            build/ci-voice-fixture/**
            build/ci-chrome-editor/**
            build/ci-chrome-omnibox/**
            build/ci-night-learning/**
