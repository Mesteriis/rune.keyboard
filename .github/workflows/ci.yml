name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [stdlib, scientific]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize pinned documentation submodule
        if: matrix.profile == 'stdlib'
        run: git submodule update --init --depth 1 -- runtime-llama/src/main/cpp/llama.cpp
      - name: Verify or rebuild historical qualification fixtures
        if: matrix.profile == 'stdlib'
        run: |
          fixtures=tools/typing_experiments/historical-qualification-v3-v4
          replay_python=python3
          if [[ ! -f "$fixtures/qualification-v3.tar.bz2" || ! -f "$fixtures/qualification-v4.tar.bz2" ]]; then
            python3 -m venv "$RUNNER_TEMP/rune-qualification-replay"
            replay_python="$RUNNER_TEMP/rune-qualification-replay/bin/python"
            "$replay_python" -m pip install pyarrow==25.0.1
          fi
          "$replay_python" tools/typing_experiments/replay_historical_qualification.py
      - name: Validate exhaustive tracked test inventory and runner
        run: |
          python tools/ci/python_tools_tests.py --check
          python -m unittest discover -s tools/ci -p test_python_tools_tests.py -v
      - name: Verify numeric Chrome fixture and independent DOM gate
        if: matrix.profile == 'stdlib'
        run: python -m unittest discover -s tools/qa/chrome-editor -p 'test_*.py' -v
      - name: Verify numeric quality period comparison
        if: matrix.profile == 'stdlib'
        run: python -m unittest discover -s tools/qa -p test_quality_period.py -v
      - name: Verify A2 Space timing report
        if: matrix.profile == 'stdlib'
        run: python -m unittest discover -s tools/qa -p test_a2_space_timing.py -v
      - name: Verify compact calibration and promotion guards
        if: matrix.profile == 'stdlib'
        run: python -m unittest discover -s tools/eval/smart-typing-0.3/pipeline -p test_evaluate_compact_autocorrection.py -v
      - name: Verify retained conversational fixtures and known exclusions
        if: matrix.profile == 'stdlib'
        run: python tools/typing_experiments/audit_disclosed_fixtures.py
      - name: Verify main README local sources and links
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_readme_sources.py
          python -m unittest discover -s tools -p test_readme_sources.py -v
      - name: Verify guide and README local navigation
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_doc_links.py
          python -m unittest discover -s tools -p test_doc_links.py -v
      - name: Check source-bound local-learning privacy disclosures
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_learning_disclosures.py
          python -m unittest discover -s tools -p test_learning_disclosures.py -v
      - name: Check typing source namespaces and orchestration documentation
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_typing_sources.py
          python -m unittest discover -s tools -p test_typing_sources.py -v
      - name: Check numeric asset notice and exact provenance inventory
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_typing_asset_notice.py
          python -m unittest discover -s tools -p test_typing_asset_notice.py -v
      - name: Check packaged provenance paths and retained source identities
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_packaged_provenance_paths.py
          python -m unittest discover -s tools -p test_packaged_provenance_paths.py -v
      - name: Check guide schema, feature count and loaded model facts
        if: matrix.profile == 'stdlib'
        run: |
          python tools/check_guide_facts.py
          python -m unittest discover -s tools -p test_guide_facts.py -v
      - name: Install pinned scientific dependencies
        if: matrix.profile == 'scientific'
        run: |
          python -m pip install -r tools/typing_experiments/requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r tools/morphology/requirements.lock
      - name: Require live pinned Pymorphy dictionary contracts
        if: matrix.profile == 'scientific'
        run: |
          python tools/ci/backend_test_gate.py --backend pymorphy --output build/pymorphy-backend-ci
          python tools/typing_experiments/register_noun_case_authored.py --check
          python tools/typing_experiments/register_grammar_contrasts.py --check
      - uses: actions/upload-artifact@v4
        if: always() && matrix.profile == 'scientific'
        with:
          name: pymorphy-backend-ci
          path: build/pymorphy-backend-ci/
          if-no-files-found: error
      - name: Verify and restore original public data fixtures
        if: matrix.profile == 'scientific'
        run: |
          python -m unittest discover -s tools/ci -p test_historical_data_fixtures.py -v
          python tools/ci/historical_data_fixtures.py --install-build build
          python -m unittest discover -s tools/ci -p test_historical_model_sources.py -v
          python tools/ci/historical_model_sources.py
          python -m unittest discover -s tools/ci -p test_historical_model_fixtures.py -v
          python -m unittest discover -s tools/ci -p test_audit_wordrank_synthetic_labels.py -v
          python tools/ci/historical_model_fixtures.py
      - name: Run isolated Python tool modules
        run: python tools/ci/python_tools_tests.py --profile "${{ matrix.profile }}" --output "build/python-tools-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-tools-${{ matrix.profile }}
          path: build/python-tools-${{ matrix.profile }}/
          if-no-files-found: error
  python-mlx:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Apple Silicon backend
        run: python -m pip install -r tools/typing_experiments/requirements-neural.txt
      - name: Require original MLX parity and finite-gradient cases on CPU
        run: python tools/ci/backend_test_gate.py --backend mlx --output build/mlx-backend-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlx-backend-ci
          path: build/mlx-backend-ci/
          if-no-files-found: error
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify or rebuild historical qualification fixtures
        run: |
          fixtures=tools/typing_experiments/historical-qualification-v3-v4
          replay_python=python3
          if [[ ! -f "$fixtures/qualification-v3.tar.bz2" || ! -f "$fixtures/qualification-v4.tar.bz2" ]]; then
            python3 -m venv "$RUNNER_TEMP/rune-qualification-replay"
            replay_python="$RUNNER_TEMP/rune-qualification-replay/bin/python"
            "$replay_python" -m pip install pyarrow==25.0.1
          fi
          "$replay_python" tools/typing_experiments/replay_historical_qualification.py
      - name: Verify exact F-Droid review data exceptions
        run: |
          python3 tools/fdroid_data_policy.py
          python3 -m unittest discover -s tools -p test_fdroid_data_policy.py
      - name: Verify durable public corpus exclusions
        run: |
          python3 -m unittest discover -s tools/eval/smart-typing-0.3/qualification-v2 -p 'test_*.py'
          python3 tools/typing_experiments/holdout_ledger.py --validate-only
          python3 -m unittest discover -s tools/typing_experiments -p 'test_*holdout_ledger.py'
          python3 -m unittest discover -s tools/typing_experiments -p test_conversation_split_checks.py
          python3 -m unittest discover -s tools/typing_experiments -p 'test_legacy_holdout_*.py'
          python3 -m unittest discover -s tools/typing_experiments -p test_legacy_family_recovery.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_ranker_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_joint_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_restore_frozen_followup.py
          python3 -m unittest discover -s tools/typing_experiments -p test_audit_family_coverage.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_spelling_v6.py
          python3 -m unittest discover -s tools/typing_experiments -p test_import_early_ru_history.py
          python3 -m unittest discover -s tools/typing_experiments -p test_recover_early_ru_sources.py
          python3 -m unittest discover -s tools/typing_experiments -p test_merge_early_ru_sources.py
          python3 tools/typing_experiments/control_ledger.py --validate-only
