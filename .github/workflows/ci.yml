name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Run fresh JVM tests
        run: ./gradlew testDebugUnitTest --rerun-tasks
      - name: Synthetic CPU duty trace contracts and report
        run: |
          python3 -m unittest discover -s tools/qa/smart-typing-0.3/duty-traces -p test_report.py
          python3 tools/qa/smart-typing-0.3/duty-traces/report.py --xml app/build/test-results/testDebugUnitTest/TEST-io.github.mesteriis.rune.keyboard.intelligence.inference.ModelDutyTraceTest.xml --output-dir build/model-duty-trace-ci
      - name: Verify offline lexicon source and benchmark contracts
        run: |
          python3 tools/lexicon/smart-typing-0.3/pipeline.py --build-dir build/lexicon-regression test
          python3 -m unittest discover -s tools/lexicon/smart-typing-0.3 -p test_build_packed_assets.py
          python3 -m unittest discover -s tools/lexicon/smart-typing-0.3 -p test_stage_packed_assets.py
          # Historical benchmark and weighted-qualification evidence lives in the
          # evidence backup branch. Ordinary CI verifies source-backed lexicon contracts
          # and must not require runtime or historical-result artifacts from main.
      - name: Verify offline scoring harness without a model
        run: |
          python3 tools/eval/smart-typing-0.3/evaluate.py validate
          python3 -m unittest discover -s tools/eval/smart-typing-0.3 -p 'test_*.py' -v
          python3 -m unittest discover -s tools/eval/smart-typing-0.3/pipeline -p 'test_*.py' -v
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/eval/smart-typing-0.3 -B build/scoring-eval-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja"
          "$cmake_bin" --build build/scoring-eval-ci --target rune-score scoring-math-test -j 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/scoring-eval-ci --output-on-failure
      - name: Verify native scoring and in-tokenizer cancellation without a model
        run: |
          python3 -m unittest discover -s tools/test-native-scoring -p 'test_*.py' -v
          python3 -m unittest discover -s tools/test-native-scoring/runtime-benchmark -p test_protocol.py -v
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/test-native-scoring -B build/native-scoring-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja"
          "$cmake_bin" --build build/native-scoring-ci --parallel 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/native-scoring-ci --output-on-failure -V
      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: error
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            build/model-duty-trace-ci/**

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Build, lint, and verify privacy
        run: ./gradlew lint assembleDebug assembleRelease assembleProfile privacyGateRelease privacyGateProfile imeIntelligenceBoundary forbiddenRuntimeDependencies :runtime-llama:nativeSymbolGate
      - name: Verify packaged native ABI boundary
        run: tools/verify-native-runtime.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stage installable artifacts
        run: |
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-artifacts/rune-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-debug.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: rune-release-unsigned.apk
          if-no-files-found: error
          path: app/build/ci-artifacts/rune-release-unsigned.apk
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          if-no-files-found: error
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.sarif

  emulator-smoke:
    name: emulator-smoke-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    # Full real-Binder suites now take about 22 minutes after an emulator is ready;
    # allow provisioning, APK installation and artifact collection to complete.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '26'
            target: google_apis
            ram-size: 2048M
            disk-size: 6G
            gpu-mode: swiftshader
            emulator-features: ''
          - api-level: '37.0'
            target: google_apis_ps16k
            ram-size: 4096M
            disk-size: 6G
            gpu-mode: swiftshader
            emulator-features: -feature GLDirectMem -feature HasSharedSlotsHostMemoryAllocator -feature -Vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android boundary suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu-mode }} ${{ matrix.emulator-features }} -noaudio -no-boot-anim -no-snapshot-save
          pre-emulator-launch-script: |
            tools/ci/install-adb-wrapper
            ./gradlew assembleDebug assembleDebugAndroidTest :runtime-llama:assembleDebugAndroidTest
            ./gradlew --stop
          script: |
            set +e
            diagnose_failure() {
              failed_step="$1"
              echo "::error title=Android boundary failure::$failed_step"
              echo '::group::Android boundary diagnostics'
              adb devices -l || true
              adb shell getprop ro.build.version.sdk || true
              adb shell ime list -s || true
              adb shell dumpsys input_method || true
              adb logcat -d -t 400 || true
              echo '::endgroup::'
            }
            run_step() {
              label="$1"
              shift
              "$@"
              status=$?
              if [ "$status" -ne 0 ]; then
                diagnose_failure "$label (exit $status)"
                exit "$status"
              fi
            }
            run_step 'install debug APK' ./gradlew --no-daemon installDebug
            mkdir -p app/build/ci-device
            adb logcat -v threadtime > app/build/ci-device/logcat.txt 2>&1 &
            run_step 'enable hardware IME visibility' adb shell settings put secure show_ime_with_hard_keyboard 1
            enabled=0
            for attempt in $(seq 1 15); do
              if adb shell ime enable io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService; then enabled=1; break; fi
              sleep 2
            done
            if [ "$enabled" -ne 1 ]; then
              diagnose_failure 'enable Rune IME'
              exit 1
            fi
            run_step 'select Rune IME' adb shell ime set io.github.mesteriis.rune.keyboard/.ime.RuneInputMethodService
            run_step 'launch QA editor' adb shell am start -W -n io.github.mesteriis.rune.keyboard/.qa.ImeQaActivity
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            status=$?
            if [ "$status" -ne 0 ]; then
              echo '::group::app instrumentation XML'
              find app/build/outputs/androidTest-results/connected/debug -name 'TEST-*.xml' -type f -exec cat {} \; || true
              python3 tools/ci/report-instrumentation-failures.py || true
              echo '::endgroup::'
              diagnose_failure "app instrumentation (exit $status)"
              exit "$status"
            fi
            run_step 'runtime instrumentation' ./gradlew --no-daemon :runtime-llama:connectedDebugAndroidTest
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/reports/androidTests/connected/debug/**
            app/build/ci-device/**
