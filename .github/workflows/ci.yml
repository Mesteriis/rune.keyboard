          python3 -m unittest discover -s tools/typing_experiments -p test_ewt_packaged_lemma_exclusions.py
          python3 tools/typing_experiments/ewt_packaged_lemma_exclusions.py --check
          python3 -m unittest discover -s tools/typing_experiments -p test_ewt_scowl_lemma_exclusions.py
