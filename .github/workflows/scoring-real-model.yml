name: qualify-exact-model-scoring

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned CMake
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" >/dev/null < <(yes)
      - name: Fetch the fixed qualification artifact
        run: |
          mkdir -p build/exact-model-input
          model=build/exact-model-input/model.gguf
          curl --fail --location --silent --show-error --retry 3 --max-filesize 396704416 \
            --output "$model" \
            'https://huggingface.co/alexm37/rune-text-v1/resolve/c057e37928624d3c3c4bd526d3515f7202395920/rune-text-v1-0.1.0-q4_k_m.gguf'
          test "$(wc -c < "$model")" -eq 396704416
          printf '%s  %s\n' '7a97111c917e19117207428971fa1c2583f2d9c2a07a6fda5b6f198b707dd9c4' "$model" | sha256sum -c -
      - name: Verify exact digest, scalar scores and tokenizer contracts
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmake_bin="$sdk_root/cmake/3.31.6/bin/cmake"
          "$cmake_bin" -S tools/test-native-scoring -B build/native-scoring-exact -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$sdk_root/cmake/3.31.6/bin/ninja" \
            -DRUNE_SCORING_MODEL="$GITHUB_WORKSPACE/build/exact-model-input/model.gguf"
          "$cmake_bin" --build build/native-scoring-exact --parallel 2
          "$sdk_root/cmake/3.31.6/bin/ctest" --test-dir build/native-scoring-exact --output-on-failure -V
      - name: Upload content-free contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-model-scoring-contracts
          if-no-files-found: warn
          path: |
            build/native-scoring-exact/Testing/Temporary/LastTest.log
            build/native-scoring-exact/rune-llama-provenance.json
