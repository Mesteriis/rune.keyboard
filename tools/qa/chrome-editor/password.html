<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rune Q8 local password</title>
<h1>Rune Q8 local password</h1>
<p><label>Ordinary field <input id="rune-normal" type="text" autocomplete="off"></label></p>
<p><label>Synthetic password <input id="rune-password" type="password" autocomplete="off"></label></p>
<output id="rune-status"></output>
<script>
const password = document.getElementById('rune-password');
let delivery = Promise.resolve();
function report() {
    const value = password.value;
    const deleted = value === 'runesecre';
    const metrics = JSON.stringify({length: value.length, typed: Number(value === 'runesecret'),
        deleted: Number(deleted)});
    delivery = delivery.then(() => fetch('/rune-q8-metrics/password', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: metrics, cache: 'no-store'})).then(response => {
            if (response.ok && deleted) document.getElementById('rune-status').textContent = 'Synthetic edit verified';
        });
}
password.addEventListener('input', report);
report();
</script>
